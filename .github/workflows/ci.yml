name: C++ Build, Tests and Package Consumer

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure library and CLI
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test library and CLI
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Install package
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/install"
      - name: Configure separate consumer
        run: cmake -S examples/consumer -B consumer-build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
      - name: Build separate consumer
        run: cmake --build consumer-build --config Release
      - name: Test imported library
        run: ctest --test-dir consumer-build --build-config Release --output-on-failure
